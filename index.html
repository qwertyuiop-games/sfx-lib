<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFX Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header><h1>SFX Library</h1></header>
    <p>Each sound efect may be used commercially</p>
    <hr />
    <main>
      <div id="ui">
        <h2>UI</h2>
        <div id="clicks">
          <h3>Clicks</h3>
        </div>
        <div id="notification">
          <h3>Notifications</h3>
        </div>
      </div>
      <hr>
      <div id="combat">
        <h2>Combat</h2>
        <div id="footsteps">
          <h3>Footsteps</h3>
        </div>
        <div id="jumps">
          <h3>Jumps</h3>
        </div>
      </div>
      <hr>
      <div id="gameplay">
        <h2>Gameplay</h2>
        <div id="pickups">
          <h3>Pickups</h3>
        </div>
        <div id="completions">
          <h3>Completions</h3>
        </div>
        <div id="failures">
          <h3>Failuers</h3>
        </div>
      </div>
    </main>
  </body>
</html>
