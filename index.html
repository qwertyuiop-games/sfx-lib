<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SFX Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>SFX Library</h1>
    </header>

    <p>Each sound effect may be used commercially</p>

    <button type="button" id="togglePreviewBtn" aria-pressed="true">
      Hide audio previews
    </button>

    <hr />

    <main>
      <div id="ui">
        <h2>UI</h2>

        <div id="clicks">
          <h3>Clicks</h3>

          <div class="sound-item">
            <audio controls class="audio-preview">
              <source src="sound/ui/clicks/ModernSelect.wav" type="audio/wav" />
              Your browser does not support the audio element.
            </audio>
            <a href="sound/ui/clicks/ModernSelect.wav" download>
              <button type="button">Download 'ModernSelect'</button>
            </a>
          </div>

          <br />

          <div class="sound-item">
            <audio controls class="audio-preview">
              <source src="sound/ui/clicks/RetroSelect.wav" type="audio/wav" />
              Your browser does not support the audio element.
            </audio>
            <a href="sound/ui/clicks/RetroSelect.wav" download>
              <button type="button">Download 'RetroSelect'</button>
            </a>
          </div>

          <br /><br />

          <div class="sound-item">
            <audio controls class="audio-preview">
              <source
                src="sound/ui/clicks/FastSwooshSelect.wav"
                type="audio/wav"
              />
              Your browser does not support the audio element.
            </audio>
            <a href="sound/ui/clicks/FastSwooshSelect.wav" download>
              <button type="button">Download 'FastSwooshSelect'</button>
            </a>
          </div>

          <br />

          <div class="sound-item">
            <audio controls class="audio-preview">
              <source
                src="sound/ui/clicks/SlowSwooshSelect.wav"
                type="audio/wav"
              />
              Your browser does not support the audio element.
            </audio>
            <a href="sound/ui/clicks/SlowSwooshSelect.wav" download>
              <button type="button">Download 'SlowSwooshSelect'</button>
            </a>
          </div>

          <br /><br />

          <div class="sound-item">
            <audio controls class="audio-preview">
              <source src="sound/ui/clicks/ShootSelect.wav" type="audio/wav" />
              Your browser does not support the audio element.
            </audio>
            <a href="sound/ui/clicks/ShootSelect.wav" download>
              <button type="button">Download 'ShootSelect'</button>
            </a>
          </div>
        </div>

        <div id="notification">
          <h3>Notifications</h3>

          <div class="sound-item">
            <audio controls class="audio-preview">
              <source
                src="sound/ui/notifications/JingleNotification.wav"
                type="audio/wav"
              />
              Your browser does not support the audio element.
            </audio>
            <a href="sound/ui/notifications/JingleNotification.wav" download>
              <button type="button">Download 'JingleNotification'</button>
            </a>
          </div>

          <br />

          <div class="sound-item">
            <audio controls class="audio-preview">
              <source
                src="sound/ui/notifications/HarpNotification.wav"
                type="audio/wav"
              />
              Your browser does not support the audio element.
            </audio>
            <a href="sound/ui/notifications/HarpNotification.wav" download>
              <button type="button">Download 'HarpNotification'</button>
            </a>
          </div>
        </div>
      </div>

      <hr />

      <div id="combat">
        <h2>Combat</h2>
        <div id="footsteps">
          <h3>Footsteps</h3>
        </div>
        <div id="jumps">
          <h3>Jumps</h3>
        </div>
      </div>

      <hr />

      <div id="gameplay">
        <h2>Gameplay</h2>
        <div id="pickups">
          <h3>Pickups</h3>
        </div>
        <div id="completions">
          <h3>Completions</h3>
        </div>
        <div id="failures">
          <h3>Failures</h3>
        </div>
      </div>
    </main>

    <script>
      const togglePreviewBtn = document.getElementById("togglePreviewBtn");
      const audioPreviews = document.querySelectorAll(".audio-preview");

      let previewsVisible = true;

      togglePreviewBtn.addEventListener("click", () => {
        previewsVisible = !previewsVisible;

        audioPreviews.forEach((audio) => {
          if (previewsVisible) {
            audio.hidden = false;
          } else {
            audio.pause();
            audio.currentTime = 0;
            audio.hidden = true;
          }
        });

        togglePreviewBtn.textContent = previewsVisible
          ? "Hide audio previews"
          : "Show audio previews";

        togglePreviewBtn.setAttribute("aria-pressed", String(!previewsVisible));
      });
    </script>
  </body>
</html>
